{% extends "base.html" %}
{% block title %}Products · Mini Shop{% endblock %}
{% block content %}
<section class="card">
  <h1>Products</h1>
  <div class="toolbar">
    <input aria-label="Search products" id="search-input" type="text" placeholder="Search products..." />
    <button id="search-btn" type="button">Search</button>
  </div>
  <div class="catalog-options">
    <label for="page-size">Products per page</label>
    <select id="page-size">
      <option value="6">6</option>
      <option value="12" selected>12</option>
      <option value="24">24</option>
      <option value="48">48</option>
    </select>
  </div>
  <p id="products-summary" class="muted" role="status" aria-live="polite"></p>
  <div id="products-list" class="product-grid"></div>
  <nav class="pagination" aria-label="Product pages" hidden>
    <button id="previous-page" type="button" disabled>Previous</button>
    <span id="page-info"></span>
    <button id="next-page" type="button" disabled>Next</button>
  </nav>
</section>

<section class="card" style="margin-top: 2rem;">
  <h2>Shopping Cart</h2>
  <div id="cart-display"></div>
  <p id="cart-error" class="error"></p>
</section>
{% endblock %}
{% block scripts %}
<script>
  function getToken() {
    return localStorage.getItem("access_token");
  }

  let currentPage = 1;
  let activeQuery = "";
  let productRequest = 0;

  async function loadProducts(query = activeQuery, page = currentPage, scrollToResults = false) {
    activeQuery = query;
    const request = ++productRequest;
    const pageSize = Number(document.getElementById("page-size").value);
    const params = new URLSearchParams({ page, page_size: pageSize });
    if (query) params.set("q", query);
    const url = (query ? "/api/products/search" : "/api/products") + "?" + params;
    const list = document.getElementById("products-list");
    const summary = document.getElementById("products-summary");
    const navigation = document.querySelector(".pagination");
    const previous = document.getElementById("previous-page");
    const next = document.getElementById("next-page");
    previous.disabled = true;
    next.disabled = true;
    navigation.hidden = true;
    summary.textContent = "Loading products...";
    list.innerHTML = "";
    const token = getToken();

    if (!token) {
      summary.textContent = "Please log in to view products.";
      return;
    }

    let products;
    try {
      const res = await fetch(url, {
        headers: { "Authorization": `Bearer ${token}` },
      });
      if (!res.ok) throw new Error("Unable to load products. Please try again or log in again.");
      products = await res.json();
      // A slower previous search must not overwrite newer results.
      if (request !== productRequest) return;
      const total = Number(res.headers.get("X-Total-Count"));
      const pages = Number(res.headers.get("X-Total-Pages"));
      currentPage = Number(res.headers.get("X-Page"));
      document.getElementById("page-info").textContent = `Page ${currentPage} of ${pages}`;
      previous.disabled = currentPage <= 1;
      next.disabled = currentPage >= pages;
      navigation.hidden = total === 0;
      const start = (currentPage - 1) * pageSize + 1;
      summary.textContent = total === 0 ? "No products found." :
        `Showing ${start}-${start + products.length - 1} of ${total} products`;
    } catch (error) {
      if (request !== productRequest) return;
      summary.textContent = error.message;
      return;
    }

    if (products.length === 0) return;

    list.innerHTML = products.map(function (product) {
      const outOfStock = product.stock == null || product.stock <= 0;
      return `
        <article class="product-card">
          <h3>${product.name}</h3>
          <p class="muted">${product.category || "Uncategorized"} • ${product.platform || "General"}</p>
          <p>${product.description || "No description available."}</p>
          <div class="product-meta">
            <strong>$${Number(product.price).toFixed(2)}</strong>
            <span>${outOfStock ? "Out of stock" : "Stock: " + product.stock}</span>
          </div>
          <div class="product-actions">
            <input type="number" class="qty-input" min="1" max="${Math.max(1, product.stock || 0)}" ${outOfStock ? "disabled" : ""} value="1" data-product-id="${product.id}" />
            <button type="button" class="add-to-cart-btn" data-product-id="${product.id}" ${outOfStock ? "disabled" : ""}>${outOfStock ? "Out of stock" : "Add to Cart"}</button>
          </div>
        </article>
      `;
    }).join("");

    if (scrollToResults) {
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      summary.scrollIntoView({ behavior: reduceMotion ? "instant" : "smooth", block: "start" });
    }

    // Attach event listeners to all "Add to Cart" buttons
    document.querySelectorAll(".add-to-cart-btn").forEach(function (btn) {
      btn.addEventListener("click", addToCart);
    });
  }

  async function addToCart(event) {
    const btn = event.target;
    const productId = btn.getAttribute("data-product-id");
    const qtyInput = document.querySelector(`.qty-input[data-product-id="${productId}"]`);
    const quantity = parseInt(qtyInput.value, 10);

    const token = getToken();
    if (!token) {
      alert("Please log in before adding items to cart.");
      return;
    }

    const res = await fetch("/api/cart", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({ product_id: parseInt(productId, 10), quantity: quantity }),
    });

    const data = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      alert(data.detail || "Failed to add item to cart.");
      return;
    }

    loadCart();
  }

  async function loadCart() {
    const token = getToken();
    const cartDisplay = document.getElementById("cart-display");
    const cartError = document.getElementById("cart-error");
    cartError.textContent = "";

    if (!token) {
      cartDisplay.innerHTML = '<p class="muted">Log in to view your cart.</p>';
      return;
    }

    const res = await fetch("/api/cart", {
      headers: { "Authorization": `Bearer ${token}` },
    });

    if (!res.ok) {
      cartError.textContent = "Failed to load cart.";
      return;
    }

    const cart = await res.json();
    if (!cart.items || cart.items.length === 0) {
      cartDisplay.innerHTML = '<p class="muted">Your cart is empty.</p>';
      return;
    }

    let html = `<table class="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>`;

    cart.items.forEach(function (item) {
      html += `
        <tr>
          <td>${item.name}</td>
          <td>$${Number(item.price).toFixed(2)}</td>
          <td>${item.quantity}</td>
          <td>$${Number(item.line_total).toFixed(2)}</td>
        </tr>
      `;
    });

    html += `</tbody></table>
      <div class="cart-total">
        <strong>Total: $${Number(cart.total).toFixed(2)}</strong>
      </div>
      <a href="/cart">Proceed to Checkout</a>`;

    cartDisplay.innerHTML = html;
  }

  document.getElementById("search-btn").addEventListener("click", function () {
    const query = document.getElementById("search-input").value.trim();
    loadProducts(query, 1);
  });

  document.getElementById("search-input").addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      const query = document.getElementById("search-input").value.trim();
      loadProducts(query, 1);
    }
  });

  document.getElementById("page-size").addEventListener("change", function () {
    loadProducts(activeQuery, 1);
  });
  document.getElementById("previous-page").addEventListener("click", function () {
    loadProducts(activeQuery, currentPage - 1, true);
  });
  document.getElementById("next-page").addEventListener("click", function () {
    loadProducts(activeQuery, currentPage + 1, true);
  });

  loadProducts();
  loadCart();
</script>
{% endblock %}
