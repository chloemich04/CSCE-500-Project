{% extends "base.html" %}
{% block title %}Products · Mini Shop{% endblock %}
{% block content %}
<section class="card">
  <h1>Products</h1>
  <div class="toolbar">
    <input id="search-input" type="text" placeholder="Search products..." />
    <button id="search-btn" type="button">Search</button>
  </div>
  <div id="products-list" class="product-grid"></div>
</section>

<section class="card" style="margin-top: 2rem;">
  <h2>Shopping Cart</h2>
  <div id="cart-display"></div>
  <p id="cart-error" class="error"></p>
</section>
{% endblock %}
{% block scripts %}
<script>
  function getToken() {
    return localStorage.getItem("access_token");
  }

  async function loadProducts(query = "") {
    const url = query ? `/api/products/search?q=${encodeURIComponent(query)}` : "/api/products";
    const res = await fetch(url);
    const products = await res.json();
    const list = document.getElementById("products-list");

    if (!Array.isArray(products) || products.length === 0) {
      list.innerHTML = '<p class="muted">No products found.</p>';
      return;
    }

    list.innerHTML = products.map(function (product) {
      return `
        <article class="product-card">
          <h3>${product.name}</h3>
          <p class="muted">${product.category || "Uncategorized"} • ${product.platform || "General"}</p>
          <p>${product.description || "No description available."}</p>
          <div class="product-meta">
            <strong>$${Number(product.price).toFixed(2)}</strong>
            <span>Stock: ${product.stock}</span>
          </div>
          <div class="product-actions">
            <input type="number" class="qty-input" min="1" max="${product.stock || 100}" value="1" data-product-id="${product.id}" />
            <button type="button" class="add-to-cart-btn" data-product-id="${product.id}">Add to Cart</button>
          </div>
        </article>
      `;
    }).join("");

    // Attach event listeners to all "Add to Cart" buttons
    document.querySelectorAll(".add-to-cart-btn").forEach(function (btn) {
      btn.addEventListener("click", addToCart);
    });
  }

  async function addToCart(event) {
    const btn = event.target;
    const productId = btn.getAttribute("data-product-id");
    const qtyInput = document.querySelector(`.qty-input[data-product-id="${productId}"]`);
    const quantity = parseInt(qtyInput.value, 10);

    const token = getToken();
    if (!token) {
      alert("Please log in before adding items to cart.");
      return;
    }

    const res = await fetch("/api/cart", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({ product_id: parseInt(productId, 10), quantity: quantity }),
    });

    const data = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      alert(data.detail || "Failed to add item to cart.");
      return;
    }

    loadCart();
  }

  async function loadCart() {
    const token = getToken();
    const cartDisplay = document.getElementById("cart-display");
    const cartError = document.getElementById("cart-error");
    cartError.textContent = "";

    if (!token) {
      cartDisplay.innerHTML = '<p class="muted">Log in to view your cart.</p>';
      return;
    }

    const res = await fetch("/api/cart", {
      headers: { "Authorization": `Bearer ${token}` },
    });

    if (!res.ok) {
      cartError.textContent = "Failed to load cart.";
      return;
    }

    const cart = await res.json();
    if (!cart.items || cart.items.length === 0) {
      cartDisplay.innerHTML = '<p class="muted">Your cart is empty.</p>';
      return;
    }

    let html = `<table class="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>`;

    cart.items.forEach(function (item) {
      html += `
        <tr>
          <td>${item.name}</td>
          <td>$${Number(item.price).toFixed(2)}</td>
          <td>${item.quantity}</td>
          <td>$${Number(item.line_total).toFixed(2)}</td>
        </tr>
      `;
    });

    html += `</tbody></table>
      <div class="cart-total">
        <strong>Total: $${Number(cart.total).toFixed(2)}</strong>
      </div>
      <button type="button" class="checkout-btn">Proceed to Checkout</button>`;

    cartDisplay.innerHTML = html;
  }

  document.getElementById("search-btn").addEventListener("click", function () {
    const query = document.getElementById("search-input").value.trim();
    loadProducts(query);
  });

  document.getElementById("search-input").addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      const query = document.getElementById("search-input").value.trim();
      loadProducts(query);
    }
  });

  loadProducts();
  loadCart();
</script>
{% endblock %}
