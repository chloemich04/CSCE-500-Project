<!DOCTYPE html>
<html lang="en">

    <title>{% block title %}Mini Shop{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="/">Mini Shop</a>
      <nav>

    <script src="/static/auth.js"></script>
    {% block scripts %}{% endblock %}

</html>
